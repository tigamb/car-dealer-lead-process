name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # מוריד את הקוד מהריפו
      - name: Checkout code
        uses: actions/checkout@v3

      # מתקין Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # מתקין את כל הדפנדנסיז
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      # מריץ את הטסטים
      - name: Run tests
        run: pytest tests/ -v

  docker:
    name: Verify Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # מוודא שה-Docker build עובר בהצלחה
      - name: Build Docker image
        run: docker build -t umi-app .